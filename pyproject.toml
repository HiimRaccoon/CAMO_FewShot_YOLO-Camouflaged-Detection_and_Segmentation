[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camo-fs-yolo"
version = "0.1.0"
description = "Kaggle pipeline for CAMO-FS YOLO11n-Seg experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: read-only audit that requires CAMO_FS_DATA_ROOT",
]

[tool.setuptools.packages.find]
include = ["camo_fs*"]
